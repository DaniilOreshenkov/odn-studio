<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1628"/>
      <stop offset="1" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="fg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0071e3"/>
      <stop offset="1" stop-color="#9b51e0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Orbit ring — matches logo: cx=16 cy=16 r=11, stroke 2.6 scaled to 32px canvas -->
  <circle cx="16" cy="16" r="10" stroke="url(#fg)" stroke-width="2.2" fill="none"/>
  <!-- Orbit node — matches logo: cx=27 cy=16 r=3.4 -->
  <circle cx="26" cy="16" r="3" fill="url(#fg)"/>
  <!-- Center dot — matches logo: r=2.4 -->
  <circle cx="16" cy="16" r="2.2" fill="url(#fg)"/>
</svg>
